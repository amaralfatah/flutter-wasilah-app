# icon.png, icon_background.png, dan icon_foreground.png diturunkan dari ikon
# keluarga Caang Labs (next-caanglabs: `npm run icons`, sumbernya
# public/app-icons/pakaya.svg, salinannya assets/icon/logo-pakaya.svg).
# Setelah ketiganya diganti, jalankan `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"

  android: true
  min_sdk_android: 21
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  # Ikon bertema Android 13+: sistem mewarnai ulang siluetnya.
  adaptive_icon_monochrome: "assets/icon/icon_foreground.png"

  ios: true
  remove_alpha_ios: true
